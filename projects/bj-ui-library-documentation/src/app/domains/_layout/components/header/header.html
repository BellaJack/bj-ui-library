<header class="bj-layout-topbar">
    <div class="bj-flex">
        <button
            class="bj-btn bj-btn-outline bj-btn-contrast bj-ds-layout-menu-button"
            type="button"
            (click)="onMenuToggle()">
            <bj-icon  [icon]="menuOpened ? 'fas fa-xmark' : 'fas fa-bars-staggered'"></bj-icon>
            <span class="bj-ty-small" aria-hidden="true">Menu</span>
            <span class="u-v-hidden">{{ menuOpened ? 'Close Menu' : 'Open Menu' }}</span>
        </button>
    </div>
    <a
        routerLink="/"
        class="bj-flex bj-gap-medium bj-link-no-decoration">
        <span aria-hidden="true" class="bj-ty-heading-2">BJ UI Library</span>
        <span class="u-v-hidden">Go to Home BJ Design System Library</span>
    </a>
    <div class="bj-flex bj-gap-medium">
        <button
            class="bj-btn bj-btn-text bj-btn-contrast bj-btn-icon"
            type="button"
            (click)="toggleDarkMode()">
            <bj-icon [size]="'large'" [icon]="_layoutService.isDarkTheme() ? 'fas fa-sun' : 'fas fa-moon'"></bj-icon>
            <span class="u-v-hidden">{{ _layoutService.isDarkTheme() ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>
        <a
            class="bj-btn bj-btn-text bj-btn-contrast bj-btn-icon"
            href="https://github.com/BellaJack/bj-ui-library"
            target="_blank">
            <bj-icon [size]="'large'" [icon]="'fab fa-github'"></bj-icon>
            <span class="u-v-hidden">GitHub</span>
        </a>
    </div>
</header>
