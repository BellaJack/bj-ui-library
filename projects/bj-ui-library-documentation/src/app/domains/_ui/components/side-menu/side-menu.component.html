@if (menuItems().length > 0) {
    <nav class="bj-ds-side-menu" aria-label="On this page">
        <div class="bj-ds-side-menu__title u-mb-xxs">On this page</div>
        <ul class="bj-ds-side-menu__list">
            @for (item of menuItems(); track item.id) {
                <li>
                    <a
                        [href]="'#' + item.id"
                        (click)="scrollToSection(item.id, $event)"
                        class="bj-ds-side-menu__link"
                        [class.bj-ds-side-menu__link--active]="activeItemId() === item.id">
                        {{ item.text }}
                    </a>
                    @if (item.children && item.children.length > 0) {
                        <ul class="bj-ds-side-menu__list bj-ds-side-menu__list--sub">
                            @for (child of item.children; track child.id) {
                                <li>
                                    <a
                                        [href]="'#' + child.id"
                                        (click)="scrollToSection(child.id, $event)"
                                        class="bj-ds-side-menu__link"
                                        [class.bj-ds-side-menu__link--active]="activeItemId() === child.id">
                                        {{ child.text }}
                                    </a>
                                </li>
                            }
                        </ul>
                    }
                </li>
            }
        </ul>
    </nav>
}
